<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0910"/>
      <stop offset="50%" stop-color="#0a080d"/>
      <stop offset="100%" stop-color="#2c0b14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e7b2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997d26"/>
    </linearGradient>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e62035"/>
      <stop offset="100%" stop-color="#7a0b16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield / Rounded Square -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="16"/>
  <!-- Gothic Bats Wings Silhouette -->
  <path d="M256 140 C280 90, 370 70, 430 130 C410 170, 360 190, 390 240 C350 230, 310 260, 290 300 C270 260, 242 260, 222 300 C202 260, 162 230, 122 240 C152 190, 102 170, 82 130 C142 70, 232 90, 256 140 Z" fill="url(#bloodGrad)" opacity="0.85"/>
  <!-- Central D6 / Gothic Cross Emblem -->
  <polygon points="256,170 340,220 340,320 256,370 172,320 172,220" fill="#0d0711" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>
  <!-- D6 Top Face -->
  <polygon points="256,170 340,220 256,270 172,220" fill="#24142a" stroke="url(#goldGrad)" stroke-width="8"/>
  <!-- D6 Left Face -->
  <polygon points="172,220 256,270 256,370 172,320" fill="#180d1c" stroke="url(#goldGrad)" stroke-width="8"/>
  <!-- D6 Right Face -->
  <polygon points="256,270 340,220 340,320 256,370" fill="#301a38" stroke="url(#goldGrad)" stroke-width="8"/>
  <!-- Crimson Drop in Center of D6 -->
  <circle cx="256" cy="270" r="14" fill="#e62035" filter="url(#glow)"/>
  <!-- Gothic Accent below -->
  <path d="M226 410 Q256 425 286 410" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
</svg>
